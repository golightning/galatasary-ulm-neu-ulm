services:
  postgres:
    image: postgres:16
    container_name: galatasaray_db
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: galatasaray_members
    ports:
      - "5432:5432"
    volumes:
      - galatasaray_db_data:/var/lib/postgresql/data

volumes:
  galatasaray_db_data:
